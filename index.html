<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de compras</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="shortcut icon" href="./images/favicon.png" type="image/x-icon">
</head>
<body>
    <!-- Sprite de icones SVG -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
        <symbol id="ico-voltar" viewBox="0 0 300 300">
            <title>Arrow Back</title>
            <path d="m71.7 168.8 105 105L150 300 0 150 150 0l26.7 26.3-105 105H300v37.5H71.7z"/>
        </symbol>
    </svg>
    <!-- /Sprite de icones SVG -->

    <div class="container">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <header class="py-4">
                    <h1 class="mb-0"><img width="156" height="40" src="./images/logo-quicklist.png" alt="Logotipo Quicklist" class="img-fluid d-block mx-auto"></h1>
                </header>

                <main>
                    <a href="#" class="d-inline-block mb-3"><svg class="me-1"><use href="#ico-voltar" /></svg>Voltar</a>
                    <h2>Compras da semana</h2>

                    <form id="add-item" class="d-sm-flex mb-4">
                        <input type="text" name="item-name" id="item-name" class="form-control mb-3 mb-sm-0 me-sm-2" placeholder="Adicione um novo item">
                        <input type="submit" value="Adicionar item" class="btn btn-send">
                    </form>

                    <ul id="items-list" class="items-list mb-5">
                        <li class="item">
                            <input type="checkbox"> <span class="item-name">Item name</span> 
                            <button type="button" class="remove-item"></button>
                        </li>
                        <li class="item">
                            <input type="checkbox"> <span class="item-name">Maecenas congue, ipsum et elementum ullamcorper, urna velit ultrices massa, in accumsan velit ligula id purus. Sed metus elit, blandit nec, ultrices id, scelerisque ultrices</span> 
                            <button type="button" class="remove-item"></button>
                        </li>
                        <li class="item">
                            <input type="checkbox"> <span class="item-name item-checked">Item name</span> 
                            <button type="button" class="remove-item"></button>
                        </li>
                    </ul>

                    <div id="status">
                        <div id="alert-error" class="alert-error d-none">
                            <span class="alert-message"></span> 
                            <button type="button" class="close-item"></button>
                        </div>

                        <div id="alert-success" class="alert-success d-none">
                            <span class="alert-message"></span> 
                            <button type="button" class="close-item"></button>
                        </div>
                    </div>

                </main>
            </div>
        </div>
    </div>


    <script src="./js/scripts.js"></script> 
</body>
</html>
